[package]
name = "lakar-desktop"
version = "0.1.0"
description = "Lakar desktop: viewer + daemon lakard lokal"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "lakar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
