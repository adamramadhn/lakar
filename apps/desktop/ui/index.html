<!doctype html>
<!-- Layar mulai Lakar desktop: menunggu lakard (sidecar) siap, lalu membuka viewer http://127.0.0.1:<port>/app/.
     Menampilkan pesan jelas bila Chrome/Edge sistem tidak ada atau daemon gagal start. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lakar</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --surface: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --accent: #3b82f6;
        --danger: #dc2626;
        --warning: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --surface: #18181b;
          --border: #2e2e33;
          --text: #f4f4f5;
          --muted: #a1a1aa;
          --danger: #f87171;
          --warning: #fbbf24;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        display: grid;
        gap: 12px;
      }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
      .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
      .status { display: flex; align-items: center; gap: 10px; }
      .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      h1 { margin: 0; font-size: 15px; }
      p { margin: 0; color: var(--muted); }
      .error h1 { color: var(--danger); }
      .warn h1 { color: var(--warning); }
      pre {
        margin: 0;
        max-height: 180px;
        overflow: auto;
        font: 12px/1.45 ui-monospace, 'Cascadia Mono', Menlo, monospace;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card" id="card" aria-live="polite">
      <div class="brand"><span class="logo" aria-hidden="true">L</span> Lakar</div>
      <div class="status" id="starting">
        <span class="spinner" aria-hidden="true"></span>
        <h1>Starting lakard…</h1>
      </div>
      <div id="problem" hidden>
        <h1 id="title"></h1>
        <p id="detail"></p>
      </div>
      <pre id="message" hidden></pre>
      <p id="logfile" hidden></p>
      <div class="actions" id="actions" hidden>
        <button type="button" class="primary" id="continue" hidden>Open Lakar anyway</button>
        <button type="button" id="retry">Restart lakard</button>
      </div>
    </main>
    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      const $ = (id) => document.getElementById(id);
      let target = '';

      function show(state) {
        const failed = state.phase === 'failed';
        const noBrowser = state.phase === 'no-browser';
        $('starting').hidden = failed || noBrowser;
        $('problem').hidden = !(failed || noBrowser);
        $('actions').hidden = !(failed || noBrowser);
        $('continue').hidden = !noBrowser;
        $('card').className = 'card ' + (failed ? 'error' : noBrowser ? 'warn' : '');
        if (noBrowser) {
          $('title').textContent = 'Google Chrome or Microsoft Edge is required';
          $('detail').textContent =
            'Lakar renders designs with the Chrome or Edge already installed on this computer. Install one of them, then restart lakard. You can still open Lakar, but previews and screenshots will fail until a browser is installed.';
        } else if (failed) {
          $('title').textContent = 'lakard could not start';
          $('detail').textContent = 'The local Lakar daemon did not start. Details are below.';
        }
        const lines = [state.message, ...(failed ? state.log.slice(-15) : [])].filter(Boolean);
        $('message').hidden = lines.length === 0 || !(failed || noBrowser);
        $('message').textContent = lines.join('\n');
        $('logfile').hidden = !failed || !state.logFile;
        $('logfile').textContent = 'Log: ' + state.logFile;
      }

      async function poll() {
        if (!invoke) {
          show({ phase: 'failed', message: 'Tauri IPC is not available in this window.', log: [], logFile: '' });
          return;
        }
        try {
          const state = await invoke('daemon_state');
          target = state.url;
          if (state.phase === 'ready') {
            location.replace(state.url);
            return;
          }
          show(state);
          if (state.phase === 'starting') setTimeout(poll, 400);
        } catch (e) {
          show({ phase: 'failed', message: String(e), log: [], logFile: '' });
        }
      }

      $('continue').addEventListener('click', () => target && location.replace(target));
      $('retry').addEventListener('click', async () => {
        if (!invoke) return;
        show({ phase: 'starting', message: '', log: [], logFile: '' });
        try {
          await invoke('restart_daemon');
        } catch (e) {
          show({ phase: 'failed', message: String(e), log: [], logFile: '' });
          return;
        }
        setTimeout(poll, 600);
      });
      poll();
    </script>
  </body>
</html>
