<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Lakar</title>
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/app/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <script>
      // Tema sebelum CSS/JS modul dimuat (tanpa kedip terang); aturan sama dengan src/theme.ts.
      (function () {
        var pref = 'system';
        try {
          var v = localStorage.getItem('lakar.viewer.theme');
          if (v === 'light' || v === 'dark' || v === 'system') pref = v;
        } catch (e) {}
        var dark = false;
        try {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        document.documentElement.dataset.theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
