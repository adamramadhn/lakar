title = "Canvas viewer merender board sebagai DOM hidup"
description = "Viewer me-mount board dengan @lakar/render di atas dokumen hasil resolveDocument (AD-6, AD-10), menggantikan gambar PNG untuk tampilan edit; font dan aset dilayani daemon lewat route /viewer/*; PNG tetap untuk export, thumbnail, dan pratinjau riwayat."
verify = "Board di canvas viewer adalah DOM dengan atribut data-lakar-id; perubahan dokumen me-render ulang tanpa screenshot; tes viewer dan daemon tetap hijau."
covers = ["R1"]
after = [2]
hitl = false
risk = "high"

