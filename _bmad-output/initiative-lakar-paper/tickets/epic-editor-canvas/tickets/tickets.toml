[[entry]]
id = 2
type = "story"
title = "Route ops viewer dan undo dengan op invers"
description = "POST /viewer/docs/:slug/ops menerima daftar op JSON (bentuk op Transaction) sebagai satu commit semua-atau-tidak (AD-7); core mengembalikan op invers per commit (AD-8) agar viewer bisa undo/redo sebagai commit baru tanpa restore rev."
verify = "Satu permintaan ops = satu rev + satu entri riwayat; op gagal me-rollback seluruh permintaan; op invers yang diterapkan mengembalikan dokumen ke keadaan sebelumnya; guard Origin berlaku."
covers = ["R1"]
after = []
hitl = false
risk = "medium"

