title = "Seleksi, geser, dan ubah ukuran di canvas"
description = "Klik memilih node, Shift menambah/mengurangi seleksi, drag kotak memilih banyak; handle seleksi sesuai desain; drag memindah node absolute atau mengurutkan ulang anak flow; handle mengubah ukuran; pratinjau lokal selama gestur dan satu commit ops di akhir (AD-7)."
verify = "Memilih, menggeser, dan mengubah ukuran node di viewer menghasilkan satu rev per gestur dan bisa di-undo."
