# Story epic model-dokumen, urut build (dipecah 2026-11-22 atas delegasi Fatmuh: "lanjut sampai build").
# Acuan: architecture-model-dokumen (AD-1 sampai AD-17). Epic ini hanya fondasi model; fitur milik epic 2-7.

[[entry]]
id = 1
type = "story"
title = "Korpus dokumen v1/v2 dan tes migrasi korpus"
description = "Membuat korpus fixture tests/fixtures/docs/v1 dan v2 (*.lakar.json) yang mencakup semua tipe node, semua jenis fill, token, halaman ganda, dan posisi absolute, plus tes yang memigrasi setiap fixture ke SCHEMA_VERSION, memvalidasinya, dan me-resolve token-nya (AD-3). README korpus menjelaskan cara menambah dokumen nyata yang disamarkan."
verify = "pnpm test menjalankan tes korpus; setiap fixture v1 dan v2 bermigrasi dan lolos LakarDocument serta resolveTokens; menambah fixture rusak membuat tes gagal."
covers = []
after = []
hitl = false
risk = "low"
references = ["_bmad-output/initiative-lakar-paper/tickets/epic-model-dokumen/architecture-model-dokumen/architecture-model-dokumen.md#ad-3--versi-skema-dan-korpus-migrasi"]
notes = ["Dokumen nyata v1/v2 (termasuk dokumen bench lama) ada di data dir VPS dan tidak bisa dijangkau dari mesin ini; korpus awal sintetis, dokumen nyata ditambahkan kemudian lewat README."]

[[entry]]
id = 2
type = "story"
title = "Skema v3: token bertipe dengan mode tema dan migrasi v2 ke v3"
description = "SCHEMA_VERSION naik ke 3. tokens menjadi {type, value, modes?} dengan tipe tertutup AD-11, tokenModes di dokumen, themeMode di board; tabel jenis-slot ke tipe-token di schema divalidasi saat commit; resolveTokens memakai mode board; migrasi 2->3 menyimpulkan tipe token (slot terbanyak, ref slot lain di-detach, token tak dipakai dari nilainya); setTokens tetap menerima nilai datar lama dan juga bentuk bertipe (AD-4). Dokumentasi API execute dan skill diperbarui."
verify = "Korpus v1/v2 bermigrasi ke v3 dan tampilannya sama (resolve v2 lama == resolve v3); setTokens({'colors.primary':'#0F62FE'}) tetap jalan; token warna di slot padding ditolak SCHEMA_INVALID; token dengan modes me-resolve sesuai themeMode board; tes route dan tool lama tetap hijau."
covers = []
after = [1]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-lakar-paper/tickets/epic-model-dokumen/architecture-model-dokumen/architecture-model-dokumen.md#ad-11--token-bertipe-dengan-mode-tema"]

[[entry]]
id = 3
type = "story"
title = "Satu pipa resolveDocument dipakai semua konsumen"
description = "Menambah resolveDocument(doc, {mode?}) di @lakar/schema (AD-10) sebagai satu-satunya pintu dari dokumen tersimpan ke dokumen ter-resolve (tahap token sekarang; tahap ekspansi instance ditambahkan epic komponen di fungsi yang sama), lalu mengganti semua pemanggilan resolveTokens langsung di daemon dan core."
verify = "Tidak ada pemanggilan resolveTokens di luar packages/schema selain lewat resolveDocument; opsi mode memaksa satu mode untuk semua board; seluruh tes daemon tetap hijau."
