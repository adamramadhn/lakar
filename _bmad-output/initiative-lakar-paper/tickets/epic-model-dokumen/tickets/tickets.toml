[[entry]]
id = 4
type = "story"
title = "Pemetaan CSS tunggal di render dipakai Copy as"
description = "Menambah modul murni packages/render/src/css.ts (AD-5) yang memetakan nilai node (panjang, warna, token -> var(--...), gradien, padding, radius, bayangan, tipografi) ke deklarasi CSS; render dan Copy as viewer memakai fungsi yang sama sehingga semantik lineHeight, letterSpacing, sudut gradien, dan padding tidak lagi diduplikasi di viewer. EDGES viewer diperluas ke render (AD-17)."
