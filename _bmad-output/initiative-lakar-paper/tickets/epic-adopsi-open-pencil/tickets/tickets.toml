[[entry]]
id = 2
type = "story"
title = "Anotasi readOnlyHint dan destructiveHint di semua tool MCP"
description = "Setiap tool server MCP Lakar (packages/mcp) mendapat anotasi MCP yang diturunkan dari efeknya: tool baca (status, inspect, screenshot, list_*, get_*, read_skill, layout_check tanpa fix, dan sejenisnya) readOnlyHint true; tool tulis readOnlyHint false, dan destructiveHint true hanya bila bisa menghapus atau menimpa isi pengguna. Pemetaan efek ditulis sekali di satu tempat sehingga tool baru wajib menyatakannya."
verify = "Tes server MCP memeriksa bahwa daftar tool (tools/list) memuat anotasi untuk setiap tool dan nilainya sesuai tabel efek; menambah tool tanpa efek membuat tes gagal; nama, input, dan output tool lama tidak berubah."
covers = ["R2"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "layout_check melaporkan saudara tumpang-tindih dan teks yang meluap"
description = "Aturan LC baru di packages/check: (a) dua node saudara di wadah flow atau absolut yang bertumpuk tanpa sengaja (di luar overlay, badge, dan pola layer yang sah) dan (b) teks yang bounds terukurnya keluar dari frame induknya. Memperluas LC-02a dan LC-20; temuan punya ID aturan, level, bounds, dan hint perbaikan; bila ada perbaikan aman, fix_check bisa menerapkannya."
verify = "Fixture yang melanggar menghasilkan temuan dengan ID aturan baru; kelima golden A–E dan korpus dokumen tetap 0 error; tes check dan fix_check hijau."
covers = ["R2"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Aturan skill: pakai ulang komponen dan verifikasi layout"
description = "Menambah ke packages/skills (core/layout/review/break-ui/selection sesuai tempatnya): pakai ulang komponen lokal sebelum membuat ulang dan ubah isi instance lewat props, bukan override; setelah ganti mode tema cek geometri, bukan hanya warna; stress test juga mencakup edit master dan mode tema; between tidak menciptakan ruang di wadah hug; sizing fill diteruskan lewat setiap wadah perantara; jangan menambal selisih ukuran dengan tinggi tebakan, clipping, atau saudara yang diposisikan manual. Teks ditulis sendiri (C1)."
verify = "Tes ukuran dan tes contoh skill tetap hijau (batas tidak naik); setiap aturan baru tercantum di skill yang tepat; contoh kode yang ditambahkan lolos tes terhadap API execute."
