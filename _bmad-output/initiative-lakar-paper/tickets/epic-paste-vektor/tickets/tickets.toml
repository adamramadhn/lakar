# Story epic paste-vektor, urut build (dipecah 2026-11-22 atas delegasi Fatmuh: "terima jadi").
# Acuan: architecture-model-dokumen (AD-1, AD-2, AD-3, AD-4, AD-5, AD-7, AD-14, AD-15). UI mengikuti design/lakar-ui.pen (C6).

[[entry]]
id = 1
type = "story"
title = "Desain paste, pen tool, dan edit titik path di lakar-ui.pen"
description = "Menambah bagian Vektor di design/lakar-ui.pen (dark dan light): pen tool di toolbar dan kursornya, mode edit path (titik anchor, handle bezier, titik terpilih, tambah/hapus titik, tutup path), kontrol stroke vektor di panel Design (fill rule, cap, join, dash, miter), serta umpan balik paste (toast ringkasan layer dan atribut yang dibuang)."
verify = "Bagian Vektor ada di lakar-ui.pen dengan versi dark dan light, memakai komponen dan token yang sudah ada, dan memuat pen tool, mode edit path, kontrol stroke vektor, dan toast paste."
covers = ["R6", "R7"]
after = []
hitl = true
risk = "medium"
notes = ["Persetujuan desain didelegasikan Fatmuh (terima jadi, 2026-11-22)."]

[[entry]]
id = 2
type = "story"
title = "Skema vektor: atribut presentasi SVG bertipe dan ekspor SVG"
description = "Skema naik satu versi dari SCHEMA_VERSION saat merge (sekarang 4; AD-3): node path mendapat fillRule, strokeLinecap, strokeLinejoin, strokeDasharray, strokeMiterlimit, dan `svg: Record<attr, string>` terbatas allowlist atribut presentasi di @lakar/schema (AD-14); d tetap format simpan. Render dan css.ts memetakannya (AD-5); serializer murni node path/frame-of-path → SVG untuk ekspor. Langkah migrasi n → n+1 dan fixture korpus v<n+1> berisi ikon multi-path."
verify = "Korpus semua versi bermigrasi, valid, dan dirender di CI Linux; fixture ikon dirender sama dengan SVG sumbernya; serializer SVG mengeluarkan kembali semua atribut bertipe dan atribut allowlist; atribut di luar allowlist ditolak validasi."
covers = ["R7"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Importer paste SVG di daemon, route, dan tool MCP"
description = "Importer di daemon (AD-15) mengurai SVG sesuai AD-14: multi-path menjadi frame berisi path, atribut presentasi ke properti bertipe atau svg allowlist, sisanya dibuang dan dilaporkan; hasil NodeInput di-commit lewat op core (AD-2). Route baru POST /viewer/docs/:slug/paste (guard Origin) dan tool MCP baru `paste` memanggil importer yang sama; Ctrl+V di viewer dengan teks SVG menyisip layer di board/frame terpilih dan menampilkan toast desain story 1."
verify = "Ikon SVG contoh (termasuk fill-rule, dash, dan transform) di-paste di viewer dan lewat tool paste menghasilkan layer identik; diekspor ulang lewat serializer story 2 tanpa kehilangan atribut; laporan atribut dibuang akurat; paste satu = satu rev dan bisa di-undo; lintas-origin ditolak 403."
covers = ["R6", "R7"]
after = [1, 2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Importer paste HTML lewat Chromium terisolasi"
description = "Importer yang sama menerima HTML: dirender di halaman Chromium terisolasi (JavaScript mati, jaringan diblokir), computed style dibaca dan dipetakan ke skema lewat tabel kebalikan css.ts (AD-5, AD-15); struktur flex/grid, teks, gambar data URI, dan SVG inline dipertahankan sebagai layer bertipe dengan tag semantik; yang tidak terpetakan dibuang dan dilaporkan. Route paste dan tool MCP paste menerima kind html; viewer membaca text/html dari clipboard."
verify = "Potongan HTML contoh (kartu, navbar, dan grid fitur) menjadi layer dengan struktur, auto layout, dan gaya terjaga, dirender dalam ambang selisih piksel terhadap HTML sumber di Chromium; skrip dan permintaan jaringan dalam HTML tidak pernah berjalan (tes); dokumen tidak menyimpan HTML atau CSS mentah (AD-1)."
covers = ["R6"]
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Pen tool dan edit titik path di canvas"
description = "Viewer sesuai desain story 1: pen tool menggambar path baru (klik titik lurus, drag handle bezier, tutup path); dobel-klik path masuk mode edit titik (pindah anchor dan handle, tambah/hapus titik); editor mengurai d saat edit lalu menulis kembali sebagai d (AD-14) tanpa menyentuh atribut lain; kontrol stroke vektor di panel Design. Pratinjau lokal selama gestur, satu commit ops di akhir (AD-7)."
verify = "Menggambar path dengan pen tool dan mengedit titik ikon hasil paste menghasilkan satu rev per gestur dan bisa di-undo; ekspor SVG ikon sesudah edit hanya mengubah d dan mempertahankan semua atribut lain; tes murni parser/serializer d (round trip) hijau."
covers = ["R7"]
after = [1, 3]
hitl = false
risk = "high"
