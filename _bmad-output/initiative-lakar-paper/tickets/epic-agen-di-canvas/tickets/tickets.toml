# Story epic agen-di-canvas, urut build (dipecah 2026-11-22 atas delegasi Fatmuh: "terima jadi").
# Acuan: architecture-model-dokumen (AD-2, AD-4, AD-7, AD-8, AD-9, AD-12). UI mengikuti design/lakar-ui.pen (C6).

[[entry]]
id = 1
type = "story"
title = "Desain state agen di canvas di lakar-ui.pen"
description = "Menambah bagian Agen di canvas di design/lakar-ui.pen (dark dan light): penanda bahwa seleksi dibagikan ke agen (badge di toolbar/Layers), sorotan sesaat node dan board yang baru ditulis agen beserta motion-nya, baris Activity untuk commit agen, dan toast saat entri undo dibuang karena perubahan agen (AD-8)."
verify = "Bagian Agen di canvas ada di lakar-ui.pen dengan versi dark dan light, memakai komponen dan token yang sudah ada, dan memuat keempat state di atas."
covers = ["R2"]
after = []
hitl = true
risk = "low"
notes = ["Persetujuan desain didelegasikan Fatmuh (terima jadi, 2026-11-22)."]

[[entry]]
id = 2
type = "story"
title = "Seleksi efemeral di daemon dan tool MCP get_selection"
description = "Route baru PUT /viewer/docs/:slug/selection (guard Origin) menerima daftar alamat node (id, atau alamat komposit AD-12 yang sudah diterima bentuknya) dan menyimpannya hanya di memori per dokumen (AD-9); perubahan disiarkan sebagai event baru `selection` lewat /viewer/events (activityHub). Viewer mengirim seleksi canvas (debounce) tanpa UI baru. Tool MCP baru `get_selection` mengembalikan slug, rev, alamat, dan ringkasan node terpilih (tipe, nama, bounds); tool lama tidak berubah (AD-4)."
verify = "Memilih node di viewer lalu memanggil get_selection lewat MCP mengembalikan alamat yang sama; seleksi tidak muncul di file dokumen, history.jsonl, maupun rev; restart daemon mengosongkan seleksi; request lintas-origin ditolak 403; tes tool MCP lama tetap hijau."
covers = ["R2"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Perubahan agen tampil live tanpa menimpa edit manual"
description = "Commit agen (execute) yang tiba lewat event change me-remount board terdampak di canvas dan disorot sesuai desain story 1; pratinjau gestur lokal yang sedang berjalan tetap dipertahankan lalu di-commit di atas rev terbaru (AD-7, tanpa penolakan baseRev); seleksi yang menunjuk node yang dihapus agen dibersihkan; entri undo yang op inversnya gagal dibuang dengan toast (AD-8); badge seleksi dibagikan dan baris Activity agen sesuai desain."
verify = "Dengan viewer terbuka, commit execute dari agen muncul di canvas tanpa reload; drag yang sedang berjalan saat agen commit tetap tersimpan sesudah dilepas dan perubahan agen juga tetap ada; undo sesudah agen menghapus node target menampilkan toast tanpa undo sebagian; tes helper murni (rebase pratinjau, pembersihan seleksi) hijau."
covers = ["R2"]
after = [1, 2]
hitl = false
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Alur varian responsif dan cek konsistensi dari seleksi"
description = "Skill agen (packages/skills) mendapat alur: get_selection → baca frame terpilih → buat board varian per lebar (mis. 390 dan 768, AD-13: varian adalah board terpisah) lewat execute → layout_check → laporkan; plus alur cek konsistensi (nilai literal yang seharusnya token, jarak tak seragam) atas seleksi. Tes integrasi daemon + MCP menjalankan alur ini terhadap dokumen fixture."
verify = "Tes integrasi: seleksi di-set lewat route viewer, agen uji memanggil get_selection lalu execute membuat board varian; event change diterima pelanggan /viewer/events dan History mencatat commit agen; tes ukuran skill diperbarui dan hijau di CI Linux."
covers = ["R2"]
after = [2, 3]
hitl = false
risk = "medium"
