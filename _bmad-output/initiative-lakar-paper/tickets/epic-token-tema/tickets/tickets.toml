# Story epic token-tema, urut build (dipecah 2026-11-22 atas delegasi Fatmuh: "terima jadi").
# Acuan: architecture-model-dokumen (AD-2, AD-4, AD-5, AD-7, AD-10, AD-11). UI mengikuti design/lakar-ui.pen (C6).
# Skema token bertipe + mode sudah ada di v3 (spec-model-dokumen-2); epic ini tidak menaikkan schemaVersion.

[[entry]]
id = 1
type = "story"
title = "Desain panel Theme dan pemilih token di lakar-ui.pen"
description = "Menambah bagian Theme di design/lakar-ui.pen (dark dan light): panel Theme berisi token per jenis (color, radius, spacing, container, breakpoint, fontFamily, fontWeight, fontSize, lineHeight, letterSpacing) dengan kolom per mode, tambah/ubah nama/hapus token, tambah mode; pemilih mode tema per board; pemilih token di field panel Design (chip token, daftar tersaring per jenis slot, aksi Detach); dialog impor CSS variables."
verify = "Bagian Theme ada di lakar-ui.pen dengan versi dark dan light, memakai komponen dan token yang sudah ada, dan memuat panel Theme, pemilih mode board, pemilih token di field, dan dialog impor."
covers = ["R3"]
after = []
hitl = true
risk = "medium"
notes = ["Persetujuan desain didelegasikan Fatmuh (terima jadi, 2026-11-22)."]

[[entry]]
id = 2
type = "story"
title = "API baca token, ganti nama token, dan impor CSS variables untuk agen"
description = "API execute mendapat fungsi baca kepala dokumen (tokens dan tokenModes; menutup deferred spec-model-dokumen-2) dan op core baru `renameToken` yang memindah semua ref {$token} dalam satu commit, juga tersedia di route ops viewer (AD-2, AD-7). Parser murni CSS variables (blok :root dan selektor mode [data-theme=…]) menghasilkan token bertipe dengan nama dari kebalikan fungsi nama variabel AD-11 dan nilai per mode; diekspos di execute sebagai fungsi impor yang commit lewat setTokens/setTokenModes. Skill api.md diperbarui (aditif, AD-4)."
verify = "Agen membaca token dan mode lewat execute; renameToken memperbarui semua pemakai dan di-undo lewat op invers; mengimpor contoh file CSS variables lewat MCP execute membuat token dengan tipe, nama, dan nilai mode yang diharapkan; cssVarName(nama hasil impor) sama dengan nama variabel sumber; setTokens nilai datar lama tetap diterima."
covers = ["R3"]
after = []
hitl = false
risk = "medium"
notes = ["Parser impor CSS variables ditaruh di epic ini (Done when: agen membuat token dari CSS variables); epic kode memakainya ulang untuk dialog impor di viewer."]

[[entry]]
id = 3
type = "story"
title = "Panel Theme: kelola token dan mode tema"
description = "Panel Theme di viewer sesuai desain story 1: daftar token per jenis dengan nilai per mode, tambah/edit/ganti nama/hapus token, tambah dan ubah nama mode, impor CSS variables dari dialog; pemilih themeMode per board di panel Design. Semua perubahan lewat route ops (setTokens, setTokenModes, renameToken, update themeMode) sehingga masuk undo per jendela (AD-8)."
verify = "Mengubah nilai satu token di panel Theme memperbarui semua node pemakainya di canvas live dalam satu rev; mengganti themeMode board mengganti nilai token di canvas; menghapus token men-detach pemakainya; setiap aksi bisa di-undo."
covers = ["R3"]
after = [1, 2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Pakai dan lepas token dari panel Design"
description = "Setiap field panel Design yang punya jenis slot (fill, stroke, radius, padding, gap, ukuran container, tipografi) menampilkan pemilih token tersaring lewat tabel slot @lakar/schema (AD-11); memasang token menulis ref {$token}; field ber-token tampil sebagai chip; Detach mengganti ref dengan nilai mode aktif board. Semua lewat route ops."
verify = "Pemilih hanya menawarkan token bertipe cocok dengan slot; memasang token lalu mengubah nilainya di panel Theme mengubah node itu di canvas; Detach menghasilkan nilai literal mode aktif; tes murni penyaringan slot dan patch detach hijau."
covers = ["R3"]
after = [3]
hitl = false
risk = "medium"
