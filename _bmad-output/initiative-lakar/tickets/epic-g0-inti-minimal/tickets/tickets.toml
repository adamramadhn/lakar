title = "Board mobile panjang, skill webapp, foto Unsplash, dan mockup hero"
description = "Dari tinjauan Adam atas PNG seri polish P7–P9 (2026-11-19). (a) Mobile satu board panjang: bila konten lebih panjang dari 844, agen membuat SATU board selebar 390 dengan tinggi mengikuti konten (minimal 844). Status bar ada di atas, tab bar/bilah aksi menempel di bawah board. Board \"(akhir)\" hasil duplikasi dan scrollY dihapus. Ubah mobile.md, contoh skill, LC-12, dan LC-20 (zona bawah = bawah board). Kriteria ukuran R1 di juri diubah secara simetris untuk kedua alat (board mobile panjang berlebar 390 tidak dihukum) sebagai versi rubrik baru (versi + sha dicatat); putaran yang sudah diputuskan tidak berubah. (b) Skill baru webapp.md untuk dashboard/aplikasi web: satu kartu KPI utama ber-fill warna merek, permukaan ber-tint, variasi grafik (batang bertumpuk, area, sparkline), aksen tegas di sidebar, tabel, dan chip delta berwarna; pola semua kartu putih + garis tipis + aksen biru masuk daftar slop. Dipasang di read_skill, instruksi MCP, dan tes (batas token, C7). (c) Foto: tangga kata kunci otomatis saat NOT_FOUND, panduan kata kunci di skill, adaptor Unsplash API (key di ~/.config/lakar/unsplash-access-key, header Client-ID, User-Agent generik), patuh pedoman Unsplash (hotlink, download_location saat dipakai, kredit di metadata aset), cache pencarian, dan urutan penyedia Unsplash → Wikimedia → Openverse. Konflik hotlink dengan AD-6/determinisme render diputuskan di plan dan dicatat sebagai follow-up arsitektur. (d) Mockup hero landing tidak lagi terpotong rata di bawah hero, lewat skill dan/atau aturan check."
verify = "pnpm build dan pnpm test lulus. Tes skill lulus: contoh lolos terhadap api.ts, batas token, read_skill webapp tersedia, dan C7 (tanpa rubrik, kata khas A/B, atau teks prompt latihan di skill). LC-12/LC-20 dan aturan mockup hero punya fixture positif dan negatif. Adaptor foto teruji dengan tangga kata kunci, cache, dan urutan penyedia (tes tanpa jaringan). Key tidak pernah muncul di git, log, atau output. Rubrik juri versi baru dengan sha tercatat, simetris untuk kedua alat. Seri latihan P7–P9 (prompt beku 1.23, juri buta, C8): Lakar dijalankan ulang di ketiganya, pen.dev dijalankan ulang hanya untuk P7, P8/P9 memakai PNG pen.dev iterasi 1. Lulus bila P7–P9 semuanya Setara atau Lebih baik, emoji 0, gerbang 0, dan waktu <= 1,5x pen.dev. Biaya kumulatif tercatat dalam batas di plan. tools/node26/verify.sh lulus. Adam sudah melihat PNG."
