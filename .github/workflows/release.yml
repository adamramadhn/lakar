name: Release desktop

# Tag v* → bangun installer tiga OS dan unggah ke GitHub Release.
# workflow_dispatch → bangun saja; installer tersedia sebagai artefak run (tanpa rilis).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      # Dipanggil nightly.yml: build dev tip dan terbitkan/timpa rilis pra-rilis `nightly`
      # (bukan tag v* — tidak memengaruhi pointer `latest` updater pengguna stabil).
      nightly:
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            # Node x64 di Rosetta pada runner arm64: peluncuran Chrome timeout, jadi syarat render dilewati.
            skip_render_check: true
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    defaults:
      run:
        shell: bash
    env:
      # Signing opsional: hanya aktif bila secret ada (lihat apps/desktop/README.md).
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Prepare sidecar (lakard + Node runtime)
        run: node apps/desktop/scripts/prepare-sidecar.mjs --target ${{ matrix.target }}

      # Jalankan daemon + MCP hasil bundel persis seperti aplikasi (macOS x64 lewat Rosetta di runner arm64).
      - name: Smoke-test sidecar
        env:
          # Runner GitHub punya Google Chrome: pool render wajib siap lewat browser sistem (kecuali lintas arsitektur).
          LAKAR_SMOKE_REQUIRE_RENDER: ${{ matrix.skip_render_check && '0' || '1' }}
        run: node apps/desktop/scripts/smoke-sidecar.mjs --target ${{ matrix.target }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # MSI hanya menerima x.y.z numerik; tag pra-rilis memakai versi di tauri.conf.json.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "LAKAR_APP_VERSION=$version" >> "$GITHUB_ENV"
          fi

      - name: Enable macOS signing
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Bentuk heredoc: aman untuk nilai multi-baris (mis. base64 .p12 yang dibungkus per 76 kolom).
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              delim="EOF_$(openssl rand -hex 8)"
              { echo "$v<<$delim"; echo "${!v}"; echo "$delim"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Enable Windows signing
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', '')))
          if ($env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pass = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          } else {
            $pass = New-Object System.Security.SecureString
          }
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
          Remove-Item $pfx
          "LAKAR_WINDOWS_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Satu file --config gabungan (versi dari tag + thumbprint signing Windows + artefak updater bila kunci ada)
      # agar tidak bergantung pada perilaku beberapa --config. Build lokal tanpa kunci tetap tanpa artefak updater.
      - name: Compose Tauri CI config
        run: |
          node -e '
            const c = {};
            if (process.env.LAKAR_APP_VERSION) c.version = process.env.LAKAR_APP_VERSION;
            if (process.env.LAKAR_WINDOWS_THUMBPRINT) c.bundle = { windows: { certificateThumbprint: process.env.LAKAR_WINDOWS_THUMBPRINT, digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com" } };
            if (process.env.HAS_UPDATER_KEY === "true") (c.bundle ??= {}).createUpdaterArtifacts = true;
            require("fs").writeFileSync("apps/desktop/src-tauri/ci-config.json", JSON.stringify(c, null, 2));
            console.log(JSON.stringify(c));
          '

      # Kunci updater hanya dipakai saat createUpdaterArtifacts aktif; tanpa secret tidak ada penandatanganan.
      - name: Build installers
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/ci-config.json

      # Installer rilis terakhir sebagai titik awal uji upgrade (opsional: belum ada rilis / gagal unduh → lewati).
      - name: Download previous Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*_x64-setup.exe' --dir "$RUNNER_TEMP/prev"
          ls -la "$RUNNER_TEMP/prev"

      # Upgrade di atas aplikasi yang berjalan (daemon, server MCP config lama, salinan Node MCP) harus sukses
      # tanpa dialog, dan hanya proses dari direktori instalasi yang dihentikan (installer-hooks.nsh).
      - name: Smoke-test installer upgrade over running app
        if: runner.os == 'Windows'
        run: |
          setup="$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -name '*-setup.exe' | head -n 1)"
          test -n "$setup"
          prev="$(find "$RUNNER_TEMP/prev" -name '*-setup.exe' 2>/dev/null | head -n 1 || true)"
          args=(--installer "$(cygpath -w "$setup")")
          if [ -n "$prev" ]; then args+=(--previous "$(cygpath -w "$prev")"); fi
          node apps/desktop/scripts/smoke-installer.mjs "${args[@]}"

      - name: Collect installers
        run: |
          out="dist-installers/${{ matrix.name }}"
          mkdir -p "$out"
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          # Nama file Tauri sudah memuat arsitektur (mis. Lakar_0.1.0_aarch64.dmg, Lakar_0.1.0_x64-setup.exe).
          # `*.sig` dan `*.app.tar.gz` adalah artefak updater (bila createUpdaterArtifacts aktif): sig dibaca
          # job latest-json; `.app.tar.gz` adalah paket update macOS yang diunggah ke Release.
          find "$bundle" -maxdepth 2 -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' -o -name '*.app.tar.gz' \) -print -exec cp {} "$out/" \;
          # Artefak updater macOS tidak membawa versi/arch di nama (Product.app.tar.gz{,.sig}) — sematkan
          # seperti penamaan dmg (Product_versi_arch) supaya kedua leg darwin tidak saling menimpa saat
          # merge artifact dan agar terpetakan ke platform di latest.json.
          for tgz in "$out"/*.app.tar.gz; do
            [ -e "$tgz" ] || continue
            product="$(basename "$tgz" .app.tar.gz)"
            # Sumber versi sama dengan yang di-bake ke bundle (LAKAR_APP_VERSION dari tag; fallback
            # tauri.conf.json untuk tag non-x.y.z/dispatch — sesuai ci-config.json).
            ver="${LAKAR_APP_VERSION:-$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")}"
            arch="${{ matrix.target }}"; arch="${arch%%-*}"; [ "$arch" = "x86_64" ] && arch=x64
            mv "$tgz" "$out/${product}_${ver}_${arch}.app.tar.gz"
            [ ! -f "$tgz.sig" ] || mv "$tgz.sig" "$out/${product}_${ver}_${arch}.app.tar.gz.sig"
          done
          ls -la "$out"
          test -n "$(ls -A "$out")"

      - uses: actions/upload-artifact@v4
        with:
          name: lakar-${{ matrix.name }}
          path: dist-installers/${{ matrix.name }}/*
          if-no-files-found: error

  # Manifest updater statis (endpoint plugins.updater.endpoints → releases/latest/download/latest.json).
  # Jalan untuk semua trigger supaya artefaknya bisa diverifikasi di dry run; dilewati dengan warning bila
  # build tidak menghasilkan sig (TAURI_SIGNING_PRIVATE_KEY tidak diatur).
  latest-json:
    name: latest.json
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Tanpa sig + tanpa kunci → lewati dengan warning. Tanpa sig + kunci ada → build updater gagal diam-diam,
      # jadi gagalkan (rilis bertanda jangan terbit tanpa latest.json).
      - name: Check updater signatures
        id: sigs
        run: |
          n="$(find dist -name '*.sig' | wc -l)"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ] && [ "$HAS_UPDATER_KEY" = "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but no updater .sig artifacts were produced"
            exit 1
          elif [ "$n" -eq 0 ]; then
            echo "::warning::No updater signatures — TAURI_SIGNING_PRIVATE_KEY not set; skipping latest.json"
          fi

      - name: Build latest.json
        if: steps.sigs.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versi dari tag bila x.y.z, selain itu versi di tauri.conf.json; tag rilis = ref, fallback v<versi>
          # untuk dry run (URL platform hanya benar di rilis bertanda nyata).
          if [[ "${{ inputs.nightly }}" == "true" ]]; then
            version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")-nightly"
            tag="nightly"
          else
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
            fi
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != v* ]]; then tag="v$version"; fi
          fi
          # Release notes (field "notes" → "What's new" di Settings → Updates). Best-effort: gagal (mis. dry run
          # tanpa tag nyata) → warning dan latest.json terbit tanpa notes.
          notes_args=()
          if gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$tag" -q .body > dist/notes.txt 2>/dev/null && [ -s dist/notes.txt ]; then
            notes_args=(--notes-file dist/notes.txt)
          else
            echo "::warning::Release notes unavailable for $tag; latest.json will have no notes"
          fi
          node apps/desktop/scripts/make-latest-json.mjs --dir dist --version "$version" --tag "$tag" --repo "$GITHUB_REPOSITORY" "${notes_args[@]}"

      - uses: actions/upload-artifact@v4
        if: steps.sigs.outputs.count != '0'
        with:
          name: lakar-latest-json
          path: dist/latest.json
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.nightly == true
    needs: [build, latest-json]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Semua artefak (installer + sig + latest.json bila ada) digabung; ikut SHA256SUMS dan unggahan rilis.
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.nightly && 'nightly' || github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          (cd installers && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          prerelease=""
          if [[ "$TAG" == *-* ]] || [[ "$TAG" == "nightly" ]]; then prerelease="--prerelease"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET"
            gh release upload "$TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "$TAG" == "nightly" ]]; then
            gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --target "$TARGET" --generate-notes --title "Lakar Nightly" $prerelease
          else
            gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Lakar $TAG" $prerelease
          fi
