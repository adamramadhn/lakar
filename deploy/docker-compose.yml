# Deployment minimal Lakar Cloud — spec-collab-cloud story 6.
#   docker compose -f deploy/docker-compose.yml up -d
# DNS: arahkan app.<domain> dan api.<domain> ke host; TLS lewat reverse proxy
# (Caddyfile contoh di deploy/Caddyfile). Satu host cukup untuk v1.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD di .env}
      POSTGRES_DB: lakar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { SERVICE: api }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/lakar
      LAKAR_API_KEY: ${LAKAR_API_KEY:?set LAKAR_API_KEY di .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.example.com}
      # Auth akun (opsional per-provider — kosong = provider tak diiklankan).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE: ${OAUTH_CALLBACK_BASE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Lakar <onboarding@resend.dev>}
      DEV_MAGIC_LINK: ${DEV_MAGIC_LINK:-1}
      PORT: 8080
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      # Share page publik: /s/<token>. Proxy TLS → sini.
      - "8081:8080"

  sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { SERVICE: sync }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/lakar
      LAKAR_API_KEY: ${LAKAR_API_KEY}
      PORT: 8080
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      # WS rooms: /room/<token>. Proxy TLS → sini (wss).
      - "8082:8080"

  lakard:
    # Render worker opsional: thumbnail/export untuk share snapshot bila
    # service nanti merender sendiri. Untuk v1 render terjadi di lakard pemilik.
    profiles: ["render-worker"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.lakard
    restart: unless-stopped
    command: ["--headless"]
    environment:
      LAKAR_PORT: 7466
    ports:
      - "7466:7466"

volumes:
  pgdata:
